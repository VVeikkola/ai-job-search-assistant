[project]
name = "ai-job-search-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VVeikkola", email = "valtteri.veikkola@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
]

[project.scripts]
ai-job-search-assistant = "ai_job_search_assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
